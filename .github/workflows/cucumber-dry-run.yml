name: Cucumber Ruby dry-run

on:
  pull_request:
    branches:
      - master
    paths:
      - 'features/**'
      - 'Gemfile'
      - 'Gemfile.lock'
      - 'cucumber.yml'
      - '.github/workflows/cucumber-dry-run.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cucumber-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Validate only AI-generated features modified in this PR
        shell: bash
        run: |
          set -euo pipefail

          BASE_REF="${GITHUB_BASE_REF:-master}"
          BASE_SHA="$(git merge-base HEAD "origin/${BASE_REF}")"
          echo "Base de comparación: ${BASE_REF} (${BASE_SHA})"

          # Regla 23: obtener los .feature modificados con salida delimitada por
          # NUL y cargarlos en un array Bash (soporta espacios/caracteres
          # especiales en los nombres). Se excluyen archivos borrados (-d).
          feature_files=()
          while IFS= read -r -d '' file; do
            feature_files+=("$file")
          done < <(git diff -z --name-only --diff-filter=d "${BASE_SHA}" HEAD -- 'features/*.feature' 'features/**/*.feature')

          if [ "${#feature_files[@]}" -eq 0 ]; then
            echo "No hay .feature nuevos o modificados en este PR. No-op informativo."
            exit 0
          fi

          echo "Features a validar (solo @PruebaGeneradaIA):"
          printf ' - %s\n' "${feature_files[@]}"

          # Regla 23: expansión del array entre comillas y filtrado por tag.
          bundle exec cucumber "${feature_files[@]}" --dry-run --tags @PruebaGeneradaIA
