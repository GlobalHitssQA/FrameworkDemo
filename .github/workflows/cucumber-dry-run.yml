name: Cucumber Ruby dry-run

on:
  pull_request:
    branches:
      - master
    paths:
      - 'features/**'
      - 'Gemfile'
      - 'Gemfile.lock'
      - 'cucumber.yml'
      - '.github/workflows/cucumber-dry-run.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cucumber-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Validate only AI-generated features modified in this PR
        shell: bash
        run: |
          set -euo pipefail

          BASE="$(git merge-base HEAD origin/master)"

          # Archivos .feature agregados/modificados en el PR, delimitados por NUL
          # para soportar nombres con espacios o caracteres especiales.
          feature_files=()
          while IFS= read -r -d '' file; do
            feature_files+=("$file")
          done < <(git diff -z --name-only --diff-filter=ACMR "$BASE" HEAD -- 'features/*.feature')

          if [ ${#feature_files[@]} -eq 0 ]; then
            echo "No hay features nuevas o modificadas en este PR. No-op informativo."
            exit 0
          fi

          echo "Validando ${#feature_files[@]} feature(s):"
          printf ' - %s\n' "${feature_files[@]}"

          bundle exec cucumber "${feature_files[@]}" --dry-run --tags @PruebaGeneradaIA
