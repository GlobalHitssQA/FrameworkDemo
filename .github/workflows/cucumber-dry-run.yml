name: Cucumber Ruby dry-run

on:
  pull_request:
    branches:
      - master
    paths:
      - 'features/**'
      - 'Gemfile'
      - 'Gemfile.lock'
      - 'cucumber.yml'
      - '.github/workflows/cucumber-dry-run.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cucumber-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Validate only AI-generated features from this PR
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(git merge-base HEAD origin/master)"
          # Solo .feature nuevos o modificados en este PR (added/copied/modified/renamed).
          CHANGED="$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- 'features/*.feature' || true)"

          if [ -z "$CHANGED" ]; then
            echo "No-op informativo: no hay .feature nuevos o modificados para validar en este PR."
            exit 0
          fi

          # Conservar unicamente los features que contengan el tag @PruebaGeneradaIA.
          FEATURE_FILES=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [ -f "$f" ] && grep -q '@PruebaGeneradaIA' "$f"; then
              FEATURE_FILES="$FEATURE_FILES $f"
            fi
          done <<< "$CHANGED"

          if [ -z "$(echo "$FEATURE_FILES" | tr -d '[:space:]')" ]; then
            echo "No-op informativo: no hay .feature con @PruebaGeneradaIA para validar en este PR."
            exit 0
          fi

          echo "Validando (dry-run) los siguientes features:$FEATURE_FILES"
          bundle exec cucumber $FEATURE_FILES --dry-run --tags @PruebaGeneradaIA
