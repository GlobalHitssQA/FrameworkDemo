name: Cucumber Ruby dry-run

on:
  pull_request:
    branches:
      - master
    paths:
      - 'features/**'
      - 'Gemfile'
      - 'Gemfile.lock'
      - 'cucumber.yml'
      - '.github/workflows/cucumber-dry-run.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cucumber-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Validate only AI-generated features modified in this PR
        shell: bash
        run: |
          set -euo pipefail

          BASE_REF="${GITHUB_BASE_REF:-master}"
          # Asegura disponibilidad de la rama base para el merge-base.
          git fetch --no-tags origin "$BASE_REF" || true

          if MERGE_BASE="$(git merge-base HEAD "origin/${BASE_REF}" 2>/dev/null)"; then
            DIFF_BASE="$MERGE_BASE"
          else
            # Fallback (p.ej. workflow_dispatch sin base): compara contra el commit previo.
            DIFF_BASE="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi

          # Carga los .feature modificados (A/C/M/R) usando salida delimitada por NUL,
          # de modo seguro ante espacios o caracteres especiales en los nombres.
          feature_files=()
          while IFS= read -r -d '' file; do
            feature_files+=("$file")
          done < <(git diff -z --name-only --diff-filter=ACMR "$DIFF_BASE" HEAD -- 'features/*.feature')

          if [ "${#feature_files[@]}" -eq 0 ]; then
            echo "No hay .feature nuevos o modificados en este PR. No-op informativo."
            exit 0
          fi

          echo "Validando ${#feature_files[@]} feature(s) etiquetada(s) @PruebaGeneradaIA:"
          printf ' - %s\n' "${feature_files[@]}"

          bundle exec cucumber "${feature_files[@]}" --dry-run --tags @PruebaGeneradaIA
